name: scrape
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (GitHub may delay runs by several minutes). Each post is only fetched when it is due - see Settings in the dashboard.
  workflow_dispatch:   # also started every 15 min by cron-job.org (GitHub's own schedule is unreliable); those runs respect the intervals
    inputs:
      force:
        description: "Fetch every post now, ignoring the intervals"
        type: boolean
        default: false

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scrape.py
        working-directory: scraper
        env:
          # Everything is scraped with Selenium + Beautiful Soup (headless Chrome is preinstalled on the runner). No API keys.
          PLATFORMS: instagram,twitter,youtube
          # Instagram/X profile pages (and reels grids = Instagram views) are login-walled for *some* server IPs.
          # So GitHub fetches post pages first, then tries grids and profiles; a block only means "keep the last numbers this run".
          IG_GRID: late
          SOFT_ACCOUNTS: twitter,instagram
          FORCE: ${{ inputs.force && '1' || '' }}   # only when "force" is ticked on a manual run
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
