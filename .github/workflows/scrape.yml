name: scrape
on:
  schedule:
    - cron: "7,37 * * * *"   # every 30 min (GitHub may delay runs by several minutes). Each post is only fetched when it is due - see Settings in the dashboard.
  workflow_dispatch: {}

concurrency: scrape

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt
      - run: pip install -r scraper/requirements.txt
      - run: python scrape.py
        working-directory: scraper
        env:
          # YouTube and X are scraped with Selenium + Beautiful Soup (headless Chrome is preinstalled on the runner).
          # Instagram uses the Graph API and is included once the IG_GRAPH_TOKEN secret exists.
          PLATFORMS: ${{ format('twitter,youtube{0}', secrets.IG_GRAPH_TOKEN != '' && ',instagram' || '') }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}   # manual runs ignore the intervals
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          IG_GRAPH_TOKEN: ${{ secrets.IG_GRAPH_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
